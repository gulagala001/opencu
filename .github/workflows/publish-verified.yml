name: Publish verified OpenCU release
on:
  push:
    branches: ['release/alpha2-verified']
    paths: ['.github/workflows/publish-verified.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          path: control
      - uses: actions/checkout@v7
        with:
          ref: a10466a9ccd3afed57eba47d1770d101fe43a8ed
          path: source
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate completed platform checks, package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DIR: ${{ github.workspace }}/source
          SOURCE_REPOSITORY: gulagala001/opencu
          SOURCE_SHA: a10466a9ccd3afed57eba47d1770d101fe43a8ed
          RELEASE_TAG: v1.0.3
          REQUIRED_CHECKS: '[{"repo":"gulagala001/opencu","sha":"a10466a9ccd3afed57eba47d1770d101fe43a8ed","workflow":"CI"},{"repo":"gulagala001/opencu","sha":"a10466a9ccd3afed57eba47d1770d101fe43a8ed","workflow":"Windows Computer Use"}]'
        run: python control/.github/release/publish_verified.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: opencu-v1.0.3-release
          path: release-assets/
          retention-days: 14
