name: Publish verified OpenCU release
on:
  push:
    branches: ['release/alpha2-verified']
    paths: ['.github/workflows/publish-verified.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 13813e9269e3b7c87778fd1aa937fc47ff0e2349
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate completed platform checks, package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DIR: ${{ github.workspace }}/source
          SOURCE_REPOSITORY: gulagala001/opencu
          SOURCE_SHA: 13813e9269e3b7c87778fd1aa937fc47ff0e2349
          RELEASE_TAG: v1.0.3
          REQUIRED_CHECKS: '[{"repo":"gulagala001/opencu","sha":"13813e9269e3b7c87778fd1aa937fc47ff0e2349","workflow":"CI"},{"repo":"gulagala001/opencu","sha":"13813e9269e3b7c87778fd1aa937fc47ff0e2349","workflow":"Windows Computer Use"},{"repo":"gulagala001/opencu","sha":"13813e9269e3b7c87778fd1aa937fc47ff0e2349","workflow":"Browser compatibility"}]'
        run: python control/.github/release/publish_verified.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: opencu-v1.0.3-release
          path: release-assets/
          retention-days: 14
