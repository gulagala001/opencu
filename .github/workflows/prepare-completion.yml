name: Prepare completion source
on:
  push:
    branches: ['completion/alpha2']
    paths: ['.github/workflows/prepare-completion.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Preserve the exact reviewed source outside the startup barrier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          baseline = subprocess.check_output(['git','show','27153eda602e587575b4e9091a12bf718934efcc:src/computer-use/browser.mjs'],text=True)
          old = '      signal?.throwIfAborted(); record.navigating = true;'
          assert baseline.count(old) == 1
          patch = """      signal?.throwIfAborted();
                if (process.platform === 'win32') {
                  // A ready document may still have native startup loading queued.
                  // Retire it only on our new empty target, before sending any user URL.
                  if (page.url() !== 'about:blank') throw new Error('The new browser target changed before its first navigation.');
                  await record.cdp.send('Page.stopLoading');
                  signal?.throwIfAborted();
                }
                record.navigating = true;"""
          # YAML removes ten spaces from this block, while JS uses six.
          patch = '\n'.join(line[10:] if i else line for i,line in enumerate(patch.splitlines()))
          Path('src/computer-use/browser.mjs').write_text(baseline.replace(old,patch,1))
          for name in ['test/fixtures/computer-use/startup-probe.mjs','.github/workflows/release-completion-probe.yml','.github/workflows/prepare-completion.yml']:
              Path(name).unlink()
          PY
          node --check src/computer-use/browser.mjs
          git diff --check
          git add src/computer-use/browser.mjs test/fixtures/computer-use/startup-probe.mjs .github/workflows/release-completion-probe.yml .github/workflows/prepare-completion.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: keep initial-navigation hardening scoped and remove temporary probes'
          git push origin HEAD:completion/alpha2
