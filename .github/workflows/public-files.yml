name: Public distribution files
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  public-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node scripts/check-public-files.mjs
      - name: Verify renderer generation and approval ownership
        run: node --unhandled-rejections=strict --test test/browser-host-generation.test.mjs test/app-approval-session-cancel.test.mjs test/desktop-approval-availability.test.mjs test/app-approvals-lifecycle.test.mjs
      - name: Verify application approval response feedback
        run: node --unhandled-rejections=strict --experimental-vm-modules --test test/app-approval-feedback.test.mjs
