name: Public distribution files
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  public-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node scripts/check-public-files.mjs
      - run: node --test test/browser-host-generation.test.mjs
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify browser cleanup retry and controller regressions
        run: node --test test/browser-cleanup-retry.test.mjs test/browser-registration-recovery.test.mjs test/browser-registration-inputs.test.mjs test/browser-context-init.test.mjs test/core.controller.test.mjs
