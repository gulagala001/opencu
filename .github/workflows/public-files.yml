name: Public distribution files
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  public-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node scripts/check-public-files.mjs
      - run: node --test test/browser-host-generation.test.mjs
      - run: node --test test/presentation-capture.test.mjs test/presentation-hide.test.mjs test/presentation-session.test.mjs test/presentation-payload.test.mjs
