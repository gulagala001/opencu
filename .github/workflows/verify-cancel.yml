name: Verify cancellation regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --unhandled-rejections=strict --test test/controller-verification-cancel.test.mjs
