name: Build, test and package verification
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve the source manifest's exact host and validate its install lock
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { verifySourceInstall } from './scripts/host-build-inputs.mjs';
          const pkg = JSON.parse(readFileSync('package.json'));
          const target = await verifySourceInstall(process.cwd(), pkg);
          appendFileSync(process.env.GITHUB_ENV, 'OPENCU_TARGET=' + target.id + '\n');
          appendFileSync(process.env.GITHUB_ENV, 'OPENCU_DSH_INSTALL=' + process.cwd() + '/../.local/dsh-sdk-' + target.commit.slice(0, 8) + '/package.json\n');
          NODE
      - run: node scripts/prepare-host-sdk.mjs
      - name: Install exact locked dependencies
        run: npm ci
      - name: Verify process supervision on this runner
        run: node --test test/cu-liveness-runner.test.mjs
      - name: Verify public distribution files
        run: node scripts/check-public-files.mjs
      # Build output is not committed; build once, then require a byte-identical rebuild.
      - name: Build and pack without publishing
        run: |
          node --input-type=module -e "import {readdir} from 'node:fs/promises'; if ((await readdir('.')).some(file => file.endsWith('.tgz'))) throw new Error('Expected a clean checkout without package archives');"
          npm exec --yes --package=pnpm@11.28.5 -- pnpm --version
          export OPENCU_PNPM="$(npm exec --yes --package=pnpm@11.28.5 -- which pnpm)"
          export OPENCU_BUILD_ROOT="$RUNNER_TEMP/opencu-build"
          export OPENCU_PACKAGE_OUT="$RUNNER_TEMP/opencu-dist"
          npm run build:targets -- "$OPENCU_TARGET"
          cp "$OPENCU_PACKAGE_OUT/$OPENCU_TARGET"/*.tgz .
          mkdir -p lib
          cp -R "$OPENCU_BUILD_ROOT/opencu-build-$OPENCU_TARGET/lib/." lib/
      - name: Verify reproducible production bytes
        run: |
          cd "$RUNNER_TEMP/opencu-build/opencu-build-$OPENCU_TARGET"
          node scripts/check-generated-client.mjs
      - name: Verify CU/BU lifecycle and regression suite
        run: |
          npx playwright install chromium
          if ! node --input-type=module -e "import {chromium} from 'playwright'; const browser = await chromium.launch(); await browser.close()"; then
            npx playwright install-deps chromium
          fi
          npm run cu:verify -- --profile full
      - name: Verify rebuilt frontend and public package contents
        run: |
          node scripts/check-web-package.mjs ./*.tgz
          node scripts/check-extension-distribution.mjs ./*.tgz
