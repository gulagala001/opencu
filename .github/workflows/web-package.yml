name: Build, test and package verification
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact locked dependencies
        run: npm ci
      - name: Verify process supervision on this runner
        run: node --test test/cu-liveness-runner.test.mjs
      - name: Verify public distribution files
        run: node scripts/check-public-files.mjs
      # Build output is not committed; build once, then require a byte-identical rebuild.
      - name: Build and pack without publishing
        run: |
          node --input-type=module -e "import {readdir} from 'node:fs/promises'; if ((await readdir('.')).some(file => file.endsWith('.tgz'))) throw new Error('Expected a clean checkout without package archives');"
          npm run pack
      - name: Verify reproducible production bytes
        run: node scripts/check-generated-client.mjs
      - name: Verify CU/BU lifecycle and regression suite
        run: |
          npx playwright install --with-deps chromium
          host=$(node -p 'require("./package.json").engines.dsh')
          npm install --prefix .local/cu-dsh-sdk --no-audit --no-fund --save-exact "@deepseek-ai/dsh@$host" "@deepseek-ai/dsh-attachment-local@$host" "@deepseek-ai/dsh-system-prompt@$host" "@deepseek-ai/dsh-tools@$host"
          npm run cu:verify -- --profile full
      - name: Verify rebuilt frontend and public package contents
        run: |
          node scripts/check-web-package.mjs ./*.tgz
          node scripts/check-extension-distribution.mjs ./*.tgz
