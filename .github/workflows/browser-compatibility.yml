name: Browser compatibility
on:
  push:
    branches: ['main']
    paths: ['src/computer-use/browser.mjs', 'test/computer-use-cold-navigation.test.mjs', 'test/computer-use-initial-navigation.test.mjs', '.github/workflows/browser-compatibility.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold-start:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: node --test --test-concurrency=1 test/computer-use-cold-navigation.test.mjs test/computer-use-initial-navigation.test.mjs
