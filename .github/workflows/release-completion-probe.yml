name: Release completion probe
on:
  push:
    branches: ['completion/alpha2']
    paths: ['test/fixtures/computer-use/startup-probe.mjs', '.github/workflows/release-completion-probe.yml']
permissions:
  contents: read
jobs:
  cold-start:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, stop-blank, commit-blank]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Exact original single-navigation regression
        env:
          CU_STARTUP_PROBE: ${{ matrix.mode }}
          TRISOUL_CU_UI_ARTIFACTS: '1'
        run: node --import ./test/fixtures/computer-use/startup-probe.mjs --test --test-concurrency=1 test/computer-use-cold-navigation.test.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cold-start-${{ matrix.mode }}
          path: cu-artifacts/
          retention-days: 7
