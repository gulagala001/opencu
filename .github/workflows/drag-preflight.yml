name: Browser drag preflight
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  drag-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --test test/browser-drag-preflight.test.mjs
